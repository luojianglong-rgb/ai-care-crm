name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./src
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install pytest

      - name: Prepare local config
        working-directory: ./src
        run: |
          if [ ! -f config.yaml ]; then
            cp config.yaml.template config.yaml
          fi

      - name: Run unit tests
        working-directory: ./src
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pytest tests/unit -v --tb=short --maxfail=5

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Lint is intentionally skipped — the frontend has many `any` types and
      # react-hooks warnings tracked in the backlog. Re-enable with:
      #   run: npm run lint